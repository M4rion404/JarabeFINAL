<h2>Login</h2>

<form (ngSubmit)="login()">
  <input
    type="email"
    placeholder="Email"
    [(ngModel)]="email"
    name="email"
    required
  />

  <input
    type="password"
    placeholder="Password"
    [(ngModel)]="password"
    name="password"
    required
  />

  <button type="submit">Entrar</button>

  <p style="color:red" *ngIf="error">{{ error }}</p>
</form>
