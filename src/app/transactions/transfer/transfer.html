<form class="space-y-4" (ngSubmit)="submit()">
  <!-- EMAIL DESTINO -->
  <div class="form-control">
    <label class="label">
      <span class="label-text">Correo del destinatario</span>
    </label>

    <input
      type="email"
      class="input input-bordered w-full"
      placeholder="usuario@email.com"
      [value]="toEmail()"
      (input)="toEmail.set($any($event.target).value)"
      [disabled]="loading()"
    />

    <label class="label">
      <span class="label-text-alt opacity-60">
        No puede ser tu propio correo
      </span>
    </label>
  </div>

  <!-- MONTO -->
  <div class="form-control">
    <label class="label">
      <span class="label-text">Monto</span>
    </label>

    <input
      type="number"
      class="input input-bordered w-full"
      placeholder="0.00"
      min="1"
      [value]="amount()"
      (input)="amount.set($any($event.target).valueAsNumber)"
      [disabled]="loading()"
    />
  </div>

  <!-- ERROR -->
  @if (error()) {
    <div class="alert alert-error">
      {{ error() }}
    </div>
  }

  <!-- SUCCESS (inline feedback) -->
  @if (success()) {
    <div class="alert alert-success">
      Transferencia realizada correctamente
    </div>
  }

  <!-- ACTIONS -->
  <div class="flex justify-end gap-2 pt-4">
    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="loading()"
    >
      @if (loading()) {
        <span class="loading loading-spinner loading-sm"></span>
      } @else {
        Transferir
      }
    </button>
  </div>
</form>

<!-- TOAST -->
@if (success()) {
  <div class="toast toast-top toast-end z-50">
    <div class="alert alert-success shadow-lg">
      <span>💸 Transferencia realizada con éxito</span>
    </div>
  </div>
}
