<form id="TransferForm" class="space-y-4" (ngSubmit)="OnSubmit()">
    
    <div class="form-control">
        <label class="label">
            <span class="label-text">Recipient Email</span>
        </label>

        <input
            id="RecipientEmailInput"
            type="email"
            class="input input-bordered w-full"
            placeholder="user@email.com"
            [value]="targetEmail()"
            (input)="targetEmail.set($any($event.target).value)"
            [disabled]="isLoading()"
        />

        <label class="label">
            <span class="label-text-alt opacity-60">
                It cannot be your own email address
            </span>
        </label>
    </div>

    <div class="form-control">
        <label class="label">
            <span class="label-text">Amount</span>
        </label>

        <input
            id="TransferAmountInput"
            type="number"
            class="input input-bordered w-full"
            placeholder="0.00"
            min="1"
            [value]="transferAmount()"
            (input)="transferAmount.set($any($event.target).valueAsNumber)"
            [disabled]="isLoading()"
        />
    </div>

    @if (errorMessage()) 
    {
        <div id="TransferErrorAlert" class="alert alert-error">
            {{ errorMessage() }}
        </div>
    }

    @if (isTransferSuccessful()) 
    {
        <div id="TransferSuccessAlert" class="alert alert-success">
            Transfer completed successfully
        </div>
    }

    <div class="flex justify-end gap-2 pt-4">
        <button
            id="ConfirmTransferButton"
            type="submit"
            class="btn btn-primary"
            [disabled]="isLoading()"
        >
            @if (isLoading()) 
            {
                <span class="loading loading-spinner loading-sm"></span>
            } 
            @else 
            {
                Transfer Funds
            }
        </button>
    </div>
</form>

@if (isTransferSuccessful()) 
{
    <div id="SuccessToastNotification" class="toast toast-top toast-end z-50">
        <div class="alert alert-success shadow-lg">
            <span>💸 Transfer successful</span>
        </div>
    </div>
}
